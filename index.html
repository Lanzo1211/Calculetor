<html>
<head>

    <title>Calculater</title>
</head>
<body>
<div class ="container">
    <div class="calculater">
        <form>
            <div class="dis" >
                <input type="text" name = "dis">
            </div>
            <div>
                <input type="button" value ="AC">
                <input type="button" value ="DEL">
                <input type="button" value =".">
                <input type="button" value ="/">
            </div>
            <div>
                <input type="button" value ="7">
                <input type="button" value ="8">
                <input type="button" value ="9">
                <input type="button" value ="*">
            </div>
            <div>
                <input type="button" value ="4">
                <input type="button" value ="5">
                <input type="button" value ="6">
                <input type="button" value ="-">
            </div>
            <div>
                <input type="button" value ="1">
                <input type="button" value ="2">
                <input type="button" value ="3">
                <input type="button" value ="+">
            </div>
            <div>
                <input type="button" value ="00">
                <input type="button" value ="0">
                <input type="button" value ="=" class="equal"> 
            </div>
        </form>
    </div>
</div>


<script src = "style.js"></script>
</body>
<style>
.container{
width: 100%;
height: 100vh; 
background: aqua;
display: flex;
align-items: center;
justify-content: center;
}
.calculater{
    background: rgb(75, 75, 74);
    padding: 20px;
    border-radius: 20px;
}
.calculater form input{
    border: 0;
    outline: 0;
    width: 60px;
    height: 60px;
    box-shadow:-8px -8px 15px rgba(128, 121, 121, 0.685),5px 5px 15px  rgba(0, 0, 0, 0.26); 
    background: transparent;
    font-size: 20px;
    color:rgb(0, 255, 242);
    cursor:pointer;
    margin: 10px;
    border-radius: 15px;
}
form .dis{
    display: flex;
    justify-content: flex-end;
    margin: 20px 0px;
}
form .dis input{
    text-align: right;
    flex: 1;
    font-size: 45px;
    box-shadow: none;
}
form input.equal{
    width: 145px;
}
</style>
</html>
